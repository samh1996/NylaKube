apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyla-spring
  namespace: hello
spec:
  replicas: 5
  selector:
    matchLabels: { app: nyla-spring }
  template:
    metadata:
      labels: { app: nyla-spring }
    spec:
      containers:
        - name: app
          image: samhendricksen/nyla-spring:1.0.2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /hello, port: 8080 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /hello, port: 8080 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
