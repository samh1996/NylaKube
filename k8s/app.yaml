# ---------- Namespace ----------
apiVersion: v1
kind: Namespace
metadata:
  name: hello

---
# ---------- Deployment (2 replicas, health probes) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyla-spring
  namespace: hello
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nyla-spring
  template:
    metadata:
      labels:
        app: nyla-spring
    spec:
      containers:
        - name: app
          image: samhendricksen/nyla-spring:1.0.3
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
# ---------- Service (LoadBalancer so it works like the cloud) ----------
apiVersion: v1
kind: Service
metadata:
  name: nyla-spring
  namespace: hello
spec:
  type: LoadBalancer
  selector:
    app: nyla-spring
  ports:
    - name: http
      port: 80
      targetPort: 8080